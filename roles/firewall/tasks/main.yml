---
- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "{{ web_http_port }}"
    proto: tcp
  when: "'webservers' in group_names"

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ web_https_port }}"
    proto: tcp
  when: "'webservers' in group_names"

- name: Allow MySQL from web servers
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "{{ mysql_port }}"
    proto: tcp
  loop: "{{ mysql_allowed_clients }}"
  when: "'dbservers' in group_names"

- name: Enable UFW
  community.general.ufw:
    state: enabled
